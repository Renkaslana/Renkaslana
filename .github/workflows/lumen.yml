# Keeps the profile in sync: checks GitHub every hour, commits only when the
# numbers changed or Lumi switches between day and night (build.mjs decides that
# from the clock, so no timezone math is needed here). Off the top of the hour
# because GitHub delays the crowded :00 slot by hours.
name: lumen

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['profile.config.json', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: lumen
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch stats
        # Optional secret GH_STATS_TOKEN (a PAT) also counts private contributions.
        run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Render assets + README
        run: node scripts/build.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md SECRET.md
          git diff --cached --quiet || (git commit -m "chore(lumen): refresh profile assets" && git push)
